version: 1
frontend:
  phases:
    preBuild:
      commands:
        # NODE_ENV=production makes yarn skip devDependencies, but `next build`
        # needs typescript/eslint from them - force them to install.
        - yarn install --frozen-lockfile --production=false
    build:
      commands:
        # Amplify console env vars only exist at build time, not in the SSR
        # runtime - bake the server-side ones into .env.production so
        # NextAuth/API routes can read them.
        - env | grep -E '^(NEXTAUTH_|API_BASE_URL|SMS_|NEXTSMS_|NEXT_PUBLIC_|UPLOADS_)' >> .env.production || true
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
